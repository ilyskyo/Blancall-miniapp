# Blancall 小程序后端 · Nginx 反向代理示例
# 放置位置：容器内 /etc/nginx/conf.d/default.conf（见 docker-compose.yml）
# 证书：/etc/nginx/certs/fullchain.pem 与 privkey.pem（腾讯云/阿里云免费证书或 Let's Encrypt）

upstream blancall_api {
    server api:3000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # 微信支付回调与小程序请求都必须走 HTTPS；此处仅保留证书校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 单文件上传上限：文档 50MB + 表单开销
    client_max_body_size 60m;
    client_body_timeout  120s;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/blancall.access.log;
    error_log  /var/log/nginx/blancall.error.log warn;

    # AI 对话：分块响应（SSE 转发），必须关闭缓冲
    location /api/v1/ai/chat {
        proxy_pass         http://blancall_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 本地存储签名下载（字体/导出文件）
    location /api/v1/files/ {
        proxy_pass         http://blancall_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # 字体经 wx.loadFontFace 加载需要 CORS
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 上传接口（大文件）
    location /api/v1/uploads/ {
        proxy_pass         http://blancall_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 其余 API
    location /api/ {
        proxy_pass         http://blancall_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 仅本机/内网可达的健康检查
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        default_type text/plain;
        return 200 "ok\n";
    }
}